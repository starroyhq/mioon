<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mioon</title>
    <style>
      #settings-boot {
        color-scheme: light dark;
        position: fixed;
        inset: 0;
        display: grid;
        grid-template: 44px minmax(0, 1fr) / min(188px, 32vw) minmax(0, 1fr);
        --settings-boot-line: light-dark(#dfe0e4, #22242a);
        --settings-boot-placeholder: light-dark(#e7e7ed, #23252a);
        background: light-dark(#f8f8fa, #141518);
        color: light-dark(#272931, #ecedef);
        font: 13px system-ui, sans-serif;
      }
      #settings-boot[hidden] { display: none; }
      html[data-theme="light"] #settings-boot { color-scheme: light; }
      html[data-theme="dark"] #settings-boot { color-scheme: dark; }
      #settings-boot header {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        padding: 0 20px;
        font-weight: 600;
        border-bottom: 1px solid var(--settings-boot-line);
      }
      #settings-boot-nav {
        border-right: 1px solid var(--settings-boot-line);
        display: flex;
        flex-direction: column;
        gap: 2px;
        overflow: auto;
        padding: 48px 8px 12px;
      }
      #settings-boot-nav span {
        display: flex;
        align-items: center;
        flex: 0 0 32px;
        padding: 0 12px;
        border-radius: 7px;
        color: light-dark(#484b54, #a3a7af);
      }
      #settings-boot-nav [aria-current="page"] {
        color: inherit;
        background: light-dark(#e7e7ed, #2a2d33);
      }
      #settings-boot-content { padding: 16px 24px; overflow: auto; }
      #settings-boot-heading { font-size: 14px; font-weight: 600; margin: 0 0 24px; }
      .settings-boot-row {
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid var(--settings-boot-line);
      }
      .settings-boot-row span {
        display: block;
        height: 12px;
        width: 26%;
        border-radius: 5px;
        background: var(--settings-boot-placeholder);
      }
      .settings-boot-row span + span { width: min(50%, 240px); height: 32px; }
      .settings-boot-group { display: none; }
      #settings-boot-content[data-category="models"] #settings-boot-skeleton:not([hidden]) {
        display: grid;
        grid-template-columns: min(180px, 30%) minmax(0, 1fr);
        gap: 16px;
      }
      #settings-boot-content[data-category="models"] .settings-boot-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-right: 12px;
        border-right: 1px solid var(--settings-boot-line);
      }
      .settings-boot-group span {
        height: 32px;
        border-radius: 7px;
        background: var(--settings-boot-placeholder);
      }
      #settings-boot-content[data-category="models"] .settings-boot-row span + span,
      #settings-boot-content[data-category="agent"] .settings-boot-row span + span { width: min(66%, 300px); }
      #settings-boot-recovery > p { margin: 0 0 12px; }
      #settings-boot-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      #settings-boot-actions button {
        color: inherit;
        font: inherit;
        padding: 6px 12px;
        min-height: 32px;
        border-radius: 7px;
        border: 1px solid var(--settings-boot-line);
        background: var(--settings-boot-placeholder);
        cursor: pointer;
      }
      @media (max-height: 720px) { #settings-boot-content { padding-top: 12px; } #settings-boot-heading { margin-bottom: 16px; } }
      @media (max-width: 820px) {
        #settings-boot { grid-template-columns: min(164px, 32vw) minmax(0, 1fr); }
        #settings-boot-content { padding-inline: 18px; }
      }
    </style>
  </head>
  <body>
    <main id="settings-boot" hidden>
      <header id="settings-boot-title">Settings</header>
      <nav id="settings-boot-nav"></nav>
      <section id="settings-boot-content" aria-labelledby="settings-boot-heading">
        <h1 id="settings-boot-heading"></h1>
        <div id="settings-boot-skeleton" aria-hidden="true">
          <div class="settings-boot-group"><span></span><span></span><span></span><span></span></div>
          <div>
            <div class="settings-boot-row"><span></span><span></span></div>
            <div class="settings-boot-row"><span></span><span></span></div>
            <div class="settings-boot-row"><span></span><span></span></div>
            <div class="settings-boot-row"><span></span><span></span></div>
          </div>
        </div>
        <div id="settings-boot-recovery" hidden>
          <p id="settings-boot-status" role="status"></p>
          <div id="settings-boot-actions">
            <button id="settings-boot-retry" type="button"></button>
            <button id="settings-boot-close" type="button" hidden></button>
          </div>
        </div>
      </section>
    </main>
    <div id="root" hidden></div>
    <script type="module" src="/src/settings-boot.ts"></script>
  </body>
</html>
