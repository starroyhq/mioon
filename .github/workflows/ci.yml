name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Source checks
    uses: ./.github/workflows/checks.yml
    with:
      source_sha: ${{ github.sha }}

  ci:
    name: CI
    if: always()
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require all checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          test "$CHECKS_RESULT" = success
