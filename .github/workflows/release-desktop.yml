name: Desktop release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish; leave empty for signed artifact-only verification
        required: false
        type: string
      update_feed_url:
        description: Candidate-only update feed directory (HTTPS or local loopback HTTP)
        required: false
        type: string
      version_override:
        description: Candidate-only package version (major.minor.patch)
        required: false
        type: string
      force_checks:
        description: Run all source checks even if this commit already passed main CI
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.release_tag || (github.event_name == 'workflow_dispatch' && format('candidate-{0}', github.run_id)) || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Freeze and validate release source
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      version: ${{ steps.release.outputs.version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      should_publish: ${{ steps.release.outputs.should_publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      reuse_checks: ${{ steps.ci.outputs.reuse_checks }}
    steps:
      - name: Checkout selected source with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0

      - name: Fetch current main
        run: git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'

      - name: Validate versions, ancestry and signing prerequisites
        id: release
        shell: bash
        env:
          MIOON_RELEASE_TAG: ${{ inputs.release_tag || '' }}
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          HAS_APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY != '' }}
        run: |
          MIOON_CHECKOUT_SHA=$(git rev-parse HEAD) node .github/scripts/release-preflight.ts --require-apple-secrets

      - name: Resolve source check evidence
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MIOON_RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          FORCE_CHECKS: ${{ inputs.force_checks || false }}
        run: |
          evidence_script="$RUNNER_TEMP/mioon-release-ci-evidence.ts"
          git show "$GITHUB_WORKFLOW_SHA:.github/scripts/release-ci-evidence.ts" > "$evidence_script"
          same_checks=false
          if git diff --quiet "$GITHUB_WORKFLOW_SHA" "$MIOON_RELEASE_SHA" -- .github/workflows/checks.yml; then
            same_checks=true
          fi
          SAME_CHECKS_WORKFLOW="$same_checks" node "$evidence_script"

      - name: Upload source check decision
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-source-check-decision
          path: artifacts/preflight/release-ci-evidence.json
          retention-days: 14
          if-no-files-found: error

      - name: Write safe preflight diagnostics
        if: always()
        env:
          RELEASE_RESULT: ${{ steps.release.outcome }}
        run: |
          mkdir -p artifacts/preflight
          printf 'release-preflight=%s\n' "$RELEASE_RESULT" > artifacts/preflight/status.log
          cat artifacts/preflight/status.log >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preflight failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-preflight-diagnostics
          path: |
            artifacts/preflight/status.log
            artifacts/release-preflight.json
          retention-days: 7
          if-no-files-found: warn

  checks:
    name: Verify frozen release source
    needs: preflight
    if: needs.preflight.outputs.reuse_checks != 'true'
    uses: ./.github/workflows/checks.yml
    with:
      source_sha: ${{ needs.preflight.outputs.release_sha }}

  desktop:
    name: Package and smoke test universal macOS on Apple silicon
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      MIOON_RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
      MIOON_RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      MIOON_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      MIOON_TARGET: macos-universal
      MIOON_PLATFORM: darwin
      MIOON_ARCH: universal
      MIOON_DESKTOP_INSPECTION_REPORT: artifacts/desktop-macos-universal/inspection.json
      MIOON_DESKTOP_SMOKE_REPORT: artifacts/desktop-macos-universal/smoke.json
      MIOON_APPLE_NOTARIZATION_REPORT: artifacts/desktop-macos-universal/app-notarization.json
      MIOON_APPLE_CLI_LAUNCHER_REPORT: artifacts/desktop-macos-universal/cli-launcher-notarization.json
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          persist-credentials: false

      - name: Verify native runner architecture
        run: |
          test "$(uname -m)" = arm64
          test "$(id -u)" -ne 0

      - name: Identify the macOS FFmpeg download
        id: ffmpeg_bottle
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          if brew list --versions ffmpeg-full >/dev/null 2>&1 || [[ "$(sw_vers -productVersion)" != 15.* ]]; then exit 0; fi
          if ! sha=$(brew info --json=v2 ffmpeg-full | jq -r '.formulae[0].bottle.stable.files.arm64_sequoia.sha256 // empty'); then exit 0; fi
          if [[ "$sha" =~ ^[a-f0-9]{64}$ ]]; then printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"; fi

      - name: Restore the exact FFmpeg bottle download
        id: ffmpeg_cache
        if: steps.ffmpeg_bottle.outputs.sha != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mioon-ffmpeg-bottle/archive.tar.gz
          key: mioon-ffmpeg-full-arm64-sequoia-${{ steps.ffmpeg_bottle.outputs.sha }}

      - name: Install macOS media tools
        id: mac_media
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          BOTTLE_SHA: ${{ steps.ffmpeg_bottle.outputs.sha }}
        run: |
          bottle_archive="$RUNNER_TEMP/mioon-ffmpeg-bottle/archive.tar.gz"
          verified_bottle() {
            [[ -f "$1" && ! -L "$1" ]] && [[ "$(shasum -a 256 < "$1" | cut -d ' ' -f 1)" == "$BOTTLE_SHA" ]]
          }
          download_cache=''
          if [[ "$BOTTLE_SHA" =~ ^[a-f0-9]{64}$ ]]; then
            if actual_sha=$(brew info --json=v2 ffmpeg-full | jq -r '.formulae[0].bottle.stable.files.arm64_sequoia.sha256 // empty') &&
              [[ "$actual_sha" == "$BOTTLE_SHA" ]] &&
              download_cache=$(brew --cache --force-bottle --bottle-tag=arm64_sequoia ffmpeg-full); then
              if verified_bottle "$bottle_archive"; then
                mkdir -p "$(dirname "$download_cache")"
                cp "$bottle_archive" "$download_cache"
                echo 'Reusing verified FFmpeg bottle download.'
              fi
            fi
          fi
          if ! brew list --versions ffmpeg-full >/dev/null 2>&1; then brew install ffmpeg-full; fi
          if [[ -n "$download_cache" ]] && verified_bottle "$download_cache"; then
            mkdir -p "$(dirname "$bottle_archive")"
            cp "$download_cache" "$bottle_archive"
            printf 'cache_ready=true\n' >> "$GITHUB_OUTPUT"
          fi
          mioon_media_prefix="$(brew --prefix ffmpeg-full)"
          printf 'MIOON_FFMPEG_PATH=%s/bin/ffmpeg\nMIOON_FFPROBE_PATH=%s/bin/ffprobe\n' "$mioon_media_prefix" "$mioon_media_prefix" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve external media tools and probe capabilities
        id: media
        run: |
          node --input-type=module -e 'import {realpathSync,appendFileSync} from "node:fs"; import {execFileSync} from "node:child_process"; for(const [key,name] of [["MIOON_FFMPEG_PATH","ffmpeg"],["MIOON_FFPROBE_PATH","ffprobe"]]){const value=realpathSync(process.env[key] || execFileSync("which",[name],{encoding:"utf8"}).trim()); appendFileSync(process.env.GITHUB_ENV,key+"="+value+"\n");}'
          node .github/scripts/media-environment.ts --platform="$MIOON_PLATFORM" --output="artifacts/desktop-$MIOON_TARGET/media.json"

      - name: Save the capability-checked FFmpeg bottle download
        if: steps.mac_media.outputs.cache_ready == 'true' && steps.ffmpeg_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mioon-ffmpeg-bottle/archive.tar.gz
          key: mioon-ffmpeg-full-arm64-sequoia-${{ steps.ffmpeg_bottle.outputs.sha }}

      - name: Apply candidate version to packaging checkout
        if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && needs.preflight.outputs.should_publish == 'false' && inputs.version_override != ''
        run: node .github/scripts/release-preflight.ts --apply-candidate-version

      - name: Build production application
        id: build
        run: node scripts/tooling.ts build --channel=production | tee "$RUNNER_TEMP/mioon-build.log"

      - name: Collect safe application build timings
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        run: |
          mkdir -p "artifacts/desktop-$MIOON_TARGET"
          awk '/^BUILD_TIMING \{"schema":1,"stage":"[a-z-]+","durationMs":[0-9]+,"result":"(success|failed)"(,"exitCode":-?[0-9]+)?\}$/ {
            sub(/^BUILD_TIMING /, ""); print
          }' "$RUNNER_TEMP/mioon-build.log" > "artifacts/desktop-$MIOON_TARGET/build-timings.jsonl"

      - name: Prepare temporary Apple signing credentials
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          umask 077
          credentials_dir="$RUNNER_TEMP/mioon-apple-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$credentials_dir"
          export MIOON_APPLE_CREDENTIALS_DIR="$credentials_dir"
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; import path from "node:path"; const dir=process.env.MIOON_APPLE_CREDENTIALS_DIR; writeFileSync(path.join(dir,"signing.p12"),Buffer.from(process.env.APPLE_CERTIFICATE,"base64"),{mode:0o600}); writeFileSync(path.join(dir,"notarization.p8"),process.env.APPLE_API_PRIVATE_KEY,{mode:0o600});'
          keychain="$credentials_dir/signing.keychain-db"
          node .github/scripts/apple-keychain.ts capture --state="$credentials_dir/keychain-search-list.json"
          keychain_password=$(uuidgen)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$credentials_dir/signing.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          node .github/scripts/apple-keychain.ts activate --state="$credentials_dir/keychain-search-list.json" --keychain="$keychain"
          printf 'int main(void) { return 0; }\n' > "$credentials_dir/signing-probe.c"
          xcrun clang "$credentials_dir/signing-probe.c" -o "$credentials_dir/signing-probe"
          codesign --sign "$APPLE_SIGNING_IDENTITY" --force --keychain "$keychain" --timestamp --options runtime "$credentials_dir/signing-probe"
          codesign --verify --strict --verbose=2 "$credentials_dir/signing-probe"
          rm "$credentials_dir/signing.p12"
          printf 'CSC_KEYCHAIN=%s\nAPPLE_API_KEY_PATH=%s\n' "$keychain" "$credentials_dir/notarization.p8" >> "$GITHUB_ENV"

      - name: Package Linux archive
        id: package_linux
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: pnpm exec electron-builder --config .generated/electron-builder.cjs --linux tar.gz --x64 --publish never

      - name: Build the signed universal macOS DMG and update ZIP
        id: package_macos
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
        run: |
          export APPLE_API_KEY="$APPLE_API_KEY_PATH"
          MIOON_RELEASE_UPDATE_FEED_URL=$(node ../../.github/scripts/release-preflight.ts --candidate-update-feed-url)
          export MIOON_RELEASE_UPDATE_FEED_URL
          # electron-builder selects the certificate type and rejects its prefix.
          signing_qualifier="${APPLE_SIGNING_IDENTITY#Developer ID Application: }"
          # The release-only hook submits the app once and recovers only explicit
          # transient ticket-service failures; it must finish before DMG creation.
          builder_started=$SECONDS
          pnpm exec electron-builder --config .generated/electron-builder.cjs --mac dmg zip --universal --publish never \
            "-c.mac.identity=$signing_qualifier" -c.mac.notarize=false \
            -c.afterSign=../../.github/scripts/notarize-app.cjs -c.dmg.sign=true -c.forceCodeSigning=true
          printf 'Universal builder (including application notarization): %ss\n' "$((SECONDS - builder_started))" >> "$GITHUB_STEP_SUMMARY"
          # The hook notarizes the application; submit the final signed DMG too.
          dmg="$GITHUB_WORKSPACE/release/desktop/production/mioon-${MIOON_RELEASE_VERSION}-mac.dmg"
          test -f "$dmg"
          notarization_report="$RUNNER_TEMP/mioon-apple-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/dmg-notarization.json"
          dmg_started=$SECONDS
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" --wait --timeout 30m --output-format json > "$notarization_report"
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const report=JSON.parse(readFileSync(process.argv[1],"utf8")); if(report.status!=="Accepted")process.exit(1);' "$notarization_report"
          node ../../.github/scripts/apple-notarization.ts --operation=staple --artifact="$dmg" \
            --output="../../artifacts/desktop-$MIOON_TARGET/dmg-stapling.json"
          printf 'DMG notarization and stapling: %ss\n' "$((SECONDS - dmg_started))" >> "$GITHUB_STEP_SUMMARY"

      - name: Notarize the signed CLI launcher separately
        id: notarize_cli_launcher
        if: runner.os == 'macOS'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
        run: |
          app_out="$GITHUB_WORKSPACE/release/desktop/production/mac-universal"
          node .github/scripts/apple-notarization.ts --operation=notarize-cli-launcher --artifact="$app_out"

      - name: Inspect final package, signatures and resources
        id: inspect
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node .github/scripts/inspect-desktop.ts --platform="$MIOON_PLATFORM" --arch="$MIOON_ARCH" \
            --package-dir=release/desktop/production --output="$MIOON_DESKTOP_INSPECTION_REPORT"

      - name: Verify the packaged update provider and final ZIP manifest
        run: |
          MIOON_RELEASE_UPDATE_FEED_URL=$(node .github/scripts/release-preflight.ts --candidate-update-feed-url)
          export MIOON_RELEASE_UPDATE_FEED_URL
          node .github/scripts/mac-update-feed.ts release/desktop/production "$MIOON_RELEASE_VERSION" "$MIOON_DESKTOP_INSPECTION_REPORT"
          mount_point=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const report=JSON.parse(readFileSync(process.env.MIOON_DESKTOP_INSPECTION_REPORT,"utf8")); if(!report.mountPoint)process.exit(1); process.stdout.write(report.mountPoint);')
          hdiutil detach "$mount_point"
          if [[ -d "$mount_point" ]]; then rmdir "$mount_point"; fi

      - name: Smoke test the final DMG on Apple silicon
        id: smoke
        run: |
          node .github/scripts/desktop-smoke.ts --platform=darwin --arch=arm64 \
            --dmg="release/desktop/production/mioon-${MIOON_RELEASE_VERSION}-mac.dmg" --output="$MIOON_DESKTOP_SMOKE_REPORT"

      - name: Collect signed packages and Apple silicon evidence
        id: stage
        run: |
          root=release/desktop/production
          stem="mioon-${MIOON_RELEASE_VERSION}-mac"
          mkdir -p artifacts/macos-verified/{packages,evidence}
          cp "$root/$stem.dmg" "$root/$stem.zip" "$root/$stem.zip.blockmap" "$root/latest-mac.yml" artifacts/macos-verified/packages/
          if [[ -f "$root/$stem.dmg.blockmap" ]]; then cp "$root/$stem.dmg.blockmap" artifacts/macos-verified/packages/; fi
          cp "artifacts/desktop-$MIOON_TARGET/"{inspection,smoke,app-notarization,cli-launcher-notarization,dmg-stapling}.json artifacts/macos-verified/evidence/

      - name: Transfer the signed universal package and arm64 evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: universal-package-for-native-smoke
          path: artifacts/macos-verified/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Write safe package diagnostics
        if: always()
        env:
          MEDIA_RESULT: ${{ steps.media.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          LINUX_PACKAGE_RESULT: ${{ steps.package_linux.outcome }}
          MACOS_PACKAGE_RESULT: ${{ steps.package_macos.outcome }}
          CLI_NOTARIZATION_RESULT: ${{ steps.notarize_cli_launcher.outcome }}
          INSPECT_RESULT: ${{ steps.inspect.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
          STAGE_RESULT: ${{ steps.stage.outcome }}
        run: |
          mkdir -p "artifacts/desktop-$MIOON_TARGET"
          printf 'media=%s\nbuild=%s\nlinux-package=%s\nmacos-package=%s\ncli-notarization=%s\ninspection=%s\nsmoke=%s\nstaging=%s\n' \
            "$MEDIA_RESULT" "$BUILD_RESULT" "$LINUX_PACKAGE_RESULT" "$MACOS_PACKAGE_RESULT" "$CLI_NOTARIZATION_RESULT" "$INSPECT_RESULT" "$SMOKE_RESULT" "$STAGE_RESULT" \
            > "artifacts/desktop-$MIOON_TARGET/status.log"
          cat "artifacts/desktop-$MIOON_TARGET/status.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload package diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-macos-universal-diagnostics
          path: |
            artifacts/desktop-macos-universal/media.json
            artifacts/desktop-macos-universal/inspection.json
            artifacts/desktop-macos-universal/smoke.json
            artifacts/desktop-macos-universal/status.log
            artifacts/desktop-macos-universal/app-notarization.json
            artifacts/desktop-macos-universal/cli-launcher-notarization.json
            artifacts/desktop-macos-universal/dmg-stapling.json
            artifacts/desktop-macos-universal/build-timings.jsonl
          retention-days: 14
          if-no-files-found: warn

      - name: Clean temporary Apple signing credentials
        if: always() && runner.os == 'macOS'
        run: |
          credentials_dir="$RUNNER_TEMP/mioon-apple-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'rm -rf "$credentials_dir"' EXIT
          mioon_cleanup_status=0
          node .github/scripts/apple-keychain.ts restore --state="$credentials_dir/keychain-search-list.json" || mioon_cleanup_status=1
          if [[ -f "$credentials_dir/signing.keychain-db" ]]; then security delete-keychain "$credentials_dir/signing.keychain-db" || mioon_cleanup_status=1; fi
          exit "$mioon_cleanup_status"

      - name: Clean owned DMG mount after interruption
        if: always() && runner.os == 'macOS'
        run: |
          node --input-type=module -e 'import {readFileSync,realpathSync} from "node:fs"; import {execFileSync} from "node:child_process"; import path from "node:path"; import os from "node:os"; let report; try{report=JSON.parse(readFileSync(process.env.MIOON_DESKTOP_INSPECTION_REPORT,"utf8"));}catch{process.exit(0);} const mount=report.mountPoint; const temp=realpathSync(os.tmpdir()); if(typeof mount==="string" && mount.startsWith(temp+path.sep+"mioon-ci-dmg-")){try{execFileSync("hdiutil",["detach",mount],{stdio:"ignore"});}catch{const info=execFileSync("hdiutil",["info"],{encoding:"utf8"});if(info.includes(mount))process.exit(1);}}'

      - name: Clean owned Linux archive extraction after interruption
        if: always() && runner.os == 'Linux'
        run: |
          node --input-type=module -e 'import {lstatSync,readFileSync,realpathSync,rmSync} from "node:fs"; import path from "node:path"; import os from "node:os"; let report; try{report=JSON.parse(readFileSync(process.env.MIOON_DESKTOP_INSPECTION_REPORT,"utf8"));}catch(error){if(error.code==="ENOENT")process.exit(0);throw error;} const root=report.extractRoot; if(root===undefined)process.exit(0); const temp=realpathSync(os.tmpdir()); if(typeof root!=="string" || path.dirname(root)!==temp || !/^mioon-ci-extract-[A-Za-z0-9]{6}$/.test(path.basename(root)))throw new Error("INVALID_OWNED_EXTRACTION_ROOT"); let info; try{info=lstatSync(root);}catch(error){if(error.code==="ENOENT")process.exit(0);throw error;} if(!info.isDirectory() || info.isSymbolicLink() || realpathSync(root)!==root)throw new Error("INVALID_OWNED_EXTRACTION_ROOT"); rmSync(root,{recursive:true});'

  intel-smoke:
    name: Smoke test the same universal DMG on Intel
    needs: [preflight, desktop]
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      MIOON_RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
      MIOON_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          persist-credentials: false

      - name: Verify the Intel runner and install macOS media tools
        shell: bash
        run: |
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0
          if ! brew list --versions ffmpeg-full >/dev/null 2>&1; then brew install ffmpeg-full; fi
          mioon_media_prefix="$(brew --prefix ffmpeg-full)"
          printf 'MIOON_FFMPEG_PATH=%s/bin/ffmpeg\nMIOON_FFPROBE_PATH=%s/bin/ffprobe\n' "$mioon_media_prefix" "$mioon_media_prefix" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Download the signed package used by Apple silicon
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: universal-package-for-native-smoke
          path: artifacts/macos-verified

      - name: Install frozen dependencies for the smoke harness
        run: pnpm install --frozen-lockfile

      - name: Smoke test the final DMG on Intel
        shell: bash
        run: |
          node .github/scripts/desktop-smoke.ts --platform=darwin --arch=x64 \
            --dmg="artifacts/macos-verified/packages/mioon-${MIOON_RELEASE_VERSION}-mac.dmg" --output=artifacts/intel/smoke.json

      - name: Upload Intel smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-macos-intel-smoke
          path: artifacts/intel/smoke.json
          retention-days: 14
          if-no-files-found: warn

  stage:
    name: Stage native-verified universal release files
    needs: [preflight, checks, desktop, intel-smoke]
    if: >-
      ${{ !cancelled() && needs.preflight.result == 'success' &&
      needs.desktop.result == 'success' && needs.intel-smoke.result == 'success' &&
      ((needs.checks.result == 'success' && needs.preflight.outputs.reuse_checks == 'false') ||
      (needs.checks.result == 'skipped' && needs.preflight.outputs.reuse_checks == 'true')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0

      - name: Download the signed package and inspection evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: universal-package-for-native-smoke
          path: artifacts/macos-verified

      - name: Download Intel smoke evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: desktop-macos-intel-smoke
          path: artifacts/intel

      - name: Stage verified release artifacts
        env:
          MIOON_RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
          MIOON_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          MIOON_DESKTOP_INSPECTION_REPORT: artifacts/macos-verified/evidence/inspection.json
          MIOON_DESKTOP_SMOKE_REPORT: artifacts/macos-verified/evidence/smoke.json
          MIOON_DESKTOP_INTEL_SMOKE_REPORT: artifacts/intel/smoke.json
        run: |
          node .github/scripts/stage-release.ts --platform=darwin --arch=universal \
            --package-dir=artifacts/macos-verified/packages --output=artifacts/release/darwin-universal

      - name: Upload verified release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mioon-desktop-macos-universal
          path: artifacts/release/darwin-universal/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish verified desktop release
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.stage.result == 'success' && needs.preflight.outputs.should_publish == 'true' }}
    needs: [preflight, stage]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout frozen source with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0

      - name: Download the native-verified universal target
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mioon-desktop-macos-universal
          path: artifacts/release/darwin-universal

      - name: Revalidate remote tag and publish immutable release
        env:
          MIOON_RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          MIOON_RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/publish-release.ts --input=artifacts/release
