name: Windows app database probe

# Temporary W0 diagnostic. Removed before delivery.
on:
  workflow_dispatch:
  push:
    branches: [howard/windows-desktop-bringup]

permissions:
  contents: read

jobs:
  probe:
    name: Windows app database probe
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js x64
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          architecture: x64
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native private storage helper
        run: pnpm --filter @mioon/node-host build:native

      - name: Probe app library open path
        run: node .github/scripts/windows-appdb-probe.mjs
