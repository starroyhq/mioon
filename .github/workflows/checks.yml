name: Reusable source checks

on:
  workflow_call:
    inputs:
      source_sha:
        description: Frozen source revision to verify
        type: string
        required: true
    outputs:
      ffmpeg_artifact:
        description: Verified Linux media toolchain artifact for this run
        value: ${{ jobs.ffmpeg.outputs.artifact_name }}
      ffmpeg_build_key:
        description: Frozen Linux media toolchain build identity
        value: ${{ jobs.ffmpeg.outputs.build_key }}

permissions:
  contents: read

jobs:
  source:
    name: Linux source checks and build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Check workflow syntax
        id: workflows
        run: |
          GOBIN="$RUNNER_TEMP/actionlint-bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/actionlint-bin/actionlint" -color

      - name: Typecheck and build development application
        id: build
        # The build entrypoint includes strict source and CI helper type checks.
        run: node scripts/tooling.ts build --channel=development

      - name: Write safe diagnostics
        if: always()
        env:
          WORKFLOW_RESULT: ${{ steps.workflows.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: |
          mkdir -p artifacts/checks-source
          {
            node --version
            pnpm --version
            printf 'workflow-syntax=%s\ntypecheck-and-build=%s\n' "$WORKFLOW_RESULT" "$BUILD_RESULT"
          } > artifacts/checks-source/status.log
          cat artifacts/checks-source/status.log >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checks-source-diagnostics
          path: artifacts/checks-source/
          retention-days: 7
          if-no-files-found: warn

  ffmpeg:
    name: Prepare verified Linux media toolchain
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      build_key: ${{ steps.identity.outputs.cache_key }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install media build dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            tar fonts-dejavu-core \
            build-essential pkg-config nasm yasm xz-utils \
            libx264-dev libass-dev libfontconfig1-dev libfreetype6-dev \
            libharfbuzz-dev libwebp-dev libzimg-dev libfribidi-dev libvpx-dev libmp3lame-dev zlib1g-dev

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0

      - name: Freeze media toolchain identity
        id: identity
        run: |
          node .github/scripts/ffmpeg-toolchain.ts identity
          printf 'artifact_name=checks-ffmpeg-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Restore exact media toolchain cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mioon-ffmpeg-toolchain
          key: ${{ steps.identity.outputs.cache_key }}

      - name: Build verified media toolchain on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          MIOON_FFMPEG_BUILD_KEY: ${{ steps.identity.outputs.cache_key }}
        run: node .github/scripts/ffmpeg-toolchain.ts build

      - name: Verify and activate media toolchain
        env:
          MIOON_FFMPEG_BUILD_KEY: ${{ steps.identity.outputs.cache_key }}
        run: node .github/scripts/ffmpeg-toolchain.ts activate

      - name: Probe prepared media capabilities
        run: node .github/scripts/media-environment.ts --platform=linux --output=artifacts/checks-ffmpeg/media.json

      - name: Save verified media toolchain cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mioon-ffmpeg-toolchain
          key: ${{ steps.identity.outputs.cache_key }}

      - name: Upload verified media toolchain
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: ${{ runner.temp }}/mioon-ffmpeg-toolchain/
          retention-days: 7
          if-no-files-found: error

      - name: Upload preparation failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checks-ffmpeg-diagnostics
          path: artifacts/checks-ffmpeg/
          retention-days: 7
          if-no-files-found: warn

  quality:
    # Keep existing shard check names stable for branch-protection rules.
    name: Linux full tests and build (shard ${{ matrix.shard }})
    needs: ffmpeg
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      MIOON_TEST_SHARD_INDEX: ${{ matrix.shard }}
      MIOON_FFMPEG_BUILD_KEY: ${{ needs.ffmpeg.outputs.build_key }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          # Frozen renderer/schema regressions read pinned ancestor Git blobs.
          fetch-depth: 0
          persist-credentials: false

      - name: Install media build dependencies
        id: dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            tar fonts-dejavu-core \
            build-essential pkg-config nasm yasm xz-utils \
            libx264-dev libass-dev libfontconfig1-dev libfreetype6-dev \
            libharfbuzz-dev libwebp-dev libzimg-dev libfribidi-dev libvpx-dev libmp3lame-dev zlib1g-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified media toolchain
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.ffmpeg.outputs.artifact_name }}
          path: ${{ runner.temp }}/mioon-ffmpeg-toolchain

      - name: Verify and activate media toolchain
        id: ffmpeg
        run: node .github/scripts/ffmpeg-toolchain.ts activate

      - name: Probe required media capabilities
        id: media
        run: |
          mkdir -p "artifacts/checks-linux-$MIOON_TEST_SHARD_INDEX"
          node .github/scripts/media-environment.ts --platform=linux --output="artifacts/checks-linux-$MIOON_TEST_SHARD_INDEX/media.json"

      - name: Run complete Linux full-lane partition in isolated files
        id: tests
        # Shards are balanced by .github/test-timings.json. A shard first runs its EXCLUSIVE_TEST_FILES alone, then
        # its other isolated files three at a time on the 4-vCPU runner (see .github/scripts/test-shard.ts).
        run: env -u NODE_OPTIONS -u NODE_PATH node .github/scripts/test-shard.ts --index="$MIOON_TEST_SHARD_INDEX" --count=8 --concurrency=3

      - name: Upload full test partition proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checks-linux-${{ matrix.shard }}-coverage
          path: |
            artifacts/checks-linux-${{ matrix.shard }}/shard.json
            artifacts/checks-linux-${{ matrix.shard }}/timings.json
            artifacts/checks-linux-${{ matrix.shard }}/timings-alone.json
          retention-days: 7
          if-no-files-found: warn

      - name: Write safe diagnostics
        if: always()
        env:
          DEPENDENCY_RESULT: ${{ steps.dependencies.outcome }}
          FFMPEG_RESULT: ${{ steps.ffmpeg.outcome }}
          MEDIA_RESULT: ${{ steps.media.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: |
          mkdir -p "artifacts/checks-linux-$MIOON_TEST_SHARD_INDEX"
          {
            node --version
            pnpm --version
            printf 'dependencies=%s\nffmpeg=%s\nmedia=%s\ntests=%s\n' "$DEPENDENCY_RESULT" "$FFMPEG_RESULT" "$MEDIA_RESULT" "$TEST_RESULT"
          } > "artifacts/checks-linux-$MIOON_TEST_SHARD_INDEX/status.log"
          cat "artifacts/checks-linux-$MIOON_TEST_SHARD_INDEX/status.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checks-linux-${{ matrix.shard }}-diagnostics
          path: artifacts/checks-linux-${{ matrix.shard }}/
          retention-days: 7
          if-no-files-found: warn

  portable:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS portable source checks
            os: macos-15
            target: macos
          - name: Windows portable source checks (no desktop support)
            os: windows-2025
            target: windows
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck source and CI helpers
        id: typecheck
        run: node scripts/tooling.ts typecheck

      - name: Test portable source behavior
        id: tests
        run: node scripts/tooling.ts test --suite=portable --concurrency=1 --reporter=tap

      - name: Test CI and release helpers
        id: helpers
        run: node --test --test-reporter=tap tests/actions-release.test.ts tests/actions-desktop-helpers.test.ts tests/actions-ffmpeg-install.test.ts tests/actions-ffmpeg-toolchain.test.ts tests/actions-test-shards.test.ts

      - name: Write safe diagnostics
        if: always()
        env:
          TARGET: ${{ matrix.target }}
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          HELPER_RESULT: ${{ steps.helpers.outcome }}
        run: |
          mkdir -p "artifacts/checks-$TARGET"
          {
            node --version
            pnpm --version
            printf 'typecheck=%s\nportable-tests=%s\nhelper-tests=%s\n' "$TYPECHECK_RESULT" "$TEST_RESULT" "$HELPER_RESULT"
          } > "artifacts/checks-$TARGET/status.log"
          cat "artifacts/checks-$TARGET/status.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checks-${{ matrix.target }}-diagnostics
          path: artifacts/checks-${{ matrix.target }}/
          retention-days: 7
          if-no-files-found: warn
