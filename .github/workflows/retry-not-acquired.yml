name: Retry not-acquired drill

# Drill phase of the "job was not acquired" retry plan. The workflow only
# classifies real runs and records the evidence; it never calls a rerun API.
# It stays manual until the coordinator approves the drill results; the
# automatic workflow_run trigger is a separate, later change.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run id to classify
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: retry-not-acquired-${{ github.event.inputs.run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  classify:
    name: Classify not-acquired run (dry run)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0

      - name: Classify without rerunning
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node .github/scripts/retry-not-acquired.ts --run-id="${{ inputs.run_id }}" --attempt=1
